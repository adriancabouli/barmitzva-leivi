<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Foto 1">
<defs>
  <linearGradient id="bg" x1=".25" y1="0" x2=".75" y2="1">
    <stop offset="0%" stop-color="#17573F"/>
    <stop offset="55%" stop-color="#0C2E23"/>
    <stop offset="100%" stop-color="#071C15"/>
  </linearGradient>
  <linearGradient id="oro" x1="0" y1="0" x2=".85" y2="1">
    <stop offset="0%" stop-color="#F2DFAE"/><stop offset="40%" stop-color="#D4AF61"/>
    <stop offset="68%" stop-color="#B8893A"/><stop offset="100%" stop-color="#E9CE8F"/>
  </linearGradient>
  <radialGradient id="halo" cx=".5" cy=".44" r=".6">
    <stop offset="0%" stop-color="#2C6B4F" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#2C6B4F" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="600" height="800" fill="url(#bg)"/>
<ellipse cx="300" cy="352" rx="300" ry="300" fill="url(#halo)"/>

<!-- marco doble concentrico: separacion 14, radios 26 y 12 -->
<rect x="34" y="34" width="532" height="732" rx="26" fill="none" stroke="url(#oro)" stroke-width="1.6" opacity=".9"/>
<rect x="48" y="48" width="504" height="704" rx="12" fill="none" stroke="url(#oro)" stroke-width="1" opacity=".45"/>

<!-- Magen David: dos triangulos cruzados -->
<g transform="translate(300 352)" fill="none" stroke="url(#oro)" stroke-width="4.4"
   stroke-linejoin="miter" stroke-miterlimit="8">
  <polygon points="0,-62 53.7,31 -53.7,31"/>
  <polygon points="0,62 -53.7,-31 53.7,-31"/>
</g>

<!-- separador -->
<g stroke="url(#oro)" stroke-width="1" opacity=".7">
  <line x1="222" y1="512" x2="278" y2="512"/><line x1="322" y1="512" x2="378" y2="512"/>
</g>
<circle cx="300" cy="512" r="3" fill="url(#oro)"/>

<g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
  <text x="300" y="576" fill="url(#oro)" font-size="26" letter-spacing="11">FOTO 1</text>
  <text x="300" y="612" fill="#F3EAD6" fill-opacity=".45" font-size="17"
        letter-spacing="2" font-style="italic">imagen de muestra</text>
</g>
</svg>
